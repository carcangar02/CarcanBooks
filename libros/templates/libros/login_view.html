{% load static %}
<html>
<head>
    <title>Login</title>
    <link rel="stylesheet" href="{% static 'libros/styles.css' %}">
</head>
<body>
    <h1>Iniciar Sesión</h1>
    <form id="login-form">
        {% csrf_token %}
        <label for="username">Usuario:</label>
        <input type="text" id="username" name="username" required><br>

        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" required><br>

        <button type="submit">Iniciar Sesión</button>
    </form>
    <div id="message-container"></div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async function(event) {
            event.preventDefault(); 

            const form = event.target;
            const username = form.username.value;
            const password = form.password.value;
            const messageContainer = document.getElementById('message-container');
            const formData = new FormData(); 
            formData.append('username', username);
            formData.append('password', password);
            try {
                const response = await fetch('/libros/login_action/', {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': csrfToken
                    },
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    // Si la respuesta es exitosa (ej: status 200-299)
                    messageContainer.style.color = 'green';
                    messageContainer.textContent = data.message || '¡Inicio de sesión exitoso! Redirigiendo...';
                    window.location.href = data.redirect_url || '/libros/librerias/'; // Redirige a la URL que envíe el backend o a una por defecto
                } else {
                    // Si hay un error (ej: status 400, 401)
                    messageContainer.style.color = 'red';
                    messageContainer.textContent = data.error || 'Error en el inicio de sesión.';
                }
            } catch (error) {
                // Por si hay un error de red
                messageContainer.style.color = 'red';
                messageContainer.textContent = 'Error de red. Por favor, inténtalo de nuevo.';
                console.error('Error en el fetch:', error);
            }
        });
    </script>
</body>
</html>
