{% load static%}

<html>
    <head>
        <link rel="stylesheet" href="{% static 'libros/styles.css' %}">
    </head>
    <body>
        <div id="menu-header">
            <div>               
                    <a href="/libros/buscador" class="btn-navegacion">Buscador</a>
            </div>
            <button id="abrirModalBtn" class="btn-navegacion">Crear Lista</button>


            <div>
                <select id="select_libreria">
                    <option value="">Todos</option>
                </select> 
            </div>

           
        </div>
            <div id="miModal" class="modal">
                <div class="modal-contenido">
                    <span class="cerrar">&times;</span>
                    <h2>Crear Nueva Lista</h2>
                    <form>
                        <div for="nombreLista">Nombre de la lista:</div><br>
                        <input type="text" id="nombreLista" name="nombreLista"><br><br>
                        <button type="submit" id="guardarListaBtn" class="btn-navegacion">Guardar</button>
                    </form>
                </div>
            </div>
        <div id="div_libros"></div>
    </body>
</html>









<script>
// Precarga desde Django del JSON de libros
const libros = JSON.parse('{{ info_libros|escapejs }}');
const container = document.getElementById("div_libros");
const librerias = JSON.parse('{{ librerias|escapejs }}');
const select = document.getElementById("select_libreria");
function crear_selects(librerias=null){
    
    librerias.forEach(libreria => {

        let option = document.createElement("option");
        option.value = libreria.pk;
        option.textContent = libreria.nombre;
        select.appendChild(option);
    });
}
crear_selects(librerias);












// Función para renderizar libros ||||||||   TENGO QUE CAMBIAR ESTO DEBIDO A LA MODIFICACION DE LA LOGICA LIBRO/LIBRERIA
function renderLibros(filtroLibreria = null) {
    container.innerHTML = "";
    let filtrados = "";

    if (filtroLibreria == "") {
        filtrados = libros;
    }

    const idLibreria = parseInt(filtroLibreria, 10);
    if (idLibreria) {
        libreriaSelect = librerias.find(libreria => libreria.pk == idLibreria);
        filtrados = libros.filter(libro => libreriaSelect.libros_pk.includes(libro.id));

    }

    filtrados.forEach(libro => {
    const div = document.createElement("div");
    div.innerHTML = `
        <p>${libro.titulo}</p>
        <a href="/libros/libro/id/${libro.id}/">
            <img src="${libro.foto}"  alt="${libro.titulo}" width="100" loading="lazy">
        </a>
    `;
    container.appendChild(div);
    
    console.log(filtroLibreria);
});





}


// Valor inicial (el valor seleccionado en el select)
inicialId = select.value;
// Render inicial de libros con esa librería seleccionada
renderLibros(inicialId);

// Evento al cambiar el select
select.addEventListener("change", (e) => {

    const libreriaId = e.target.value;
    renderLibros(libreriaId);
});









var modal = document.getElementById("miModal");
var btn = document.getElementById("abrirModalBtn");
var span = document.getElementsByClassName("cerrar")[0];


btn.onclick = function() {
  modal.style.display = "block";
}

span.onclick = function() {
  modal.style.display = "none";
}

window.onclick = function(event) {
  if (event.target == modal) {
    modal.style.display = "none";
  }
}




document.getElementById("guardarListaBtn").addEventListener("click", enviarFormulario);

    
async function enviarFormulario(event) {
        event.preventDefault();
        
        const nombreLista = document.getElementById("nombreLista").value;
        if (nombreLista) {
            const formData = new FormData();
            formData.append('nombreLista', nombreLista);
            const response = await fetch('/libros/crear_libreria/', {
                method: 'POST',
                headers: {
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: formData
            });
            if (response.ok) {
                const data = await response.json();
                alert(data.message || '¡Lista creada con éxito!');
                modal.style.display = "none";



                //Aqui hacer la recarga dinamica
                



            } else {
                const errorData = await response.json();
                alert(errorData.error || 'Error al crear la lista.');
            }
        } else {
            alert('El nombre de la lista no puede estar vacío');
        }
    
}




</script>
